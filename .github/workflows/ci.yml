name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  nix:
    name: Nix · ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      SYSTEM: ${{ matrix.system }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - name: An unsupported system is refused, naming the supported ones
        run: |
          if nix eval --raw .#packages.x86_64-windows.gritlint 2>refused.log; then
            echo "x86_64-windows evaluated" >&2
            exit 1
          fi
          grep -q "gritlint's flake builds on x86_64-linux, aarch64-linux; x86_64-windows is not one of them" refused.log

      - name: Every flake output for this system
        id: targets
        run: |
          kinds="$(nix eval --raw --impure --expr "let o = (builtins.getFlake (toString ./.)).outputs; in toString (builtins.filter (k: builtins.isAttrs o.\${k} && o.\${k} ? \"$SYSTEM\") (builtins.attrNames o))")"
          for kind in $kinds; do
            names="$(nix eval --raw ".#$kind.$SYSTEM" --apply 'set: toString (builtins.attrNames set)')"
            for name in $names; do
              echo ".#$kind.$SYSTEM.$name"
            done
          done > "$RUNNER_TEMP/targets"
          cat "$RUNNER_TEMP/targets"
          xargs -a "$RUNNER_TEMP/targets" -I{} nix eval --raw '{}.outPath' --apply 'p: p + "\n"' > "$RUNNER_TEMP/outputs"
          echo "key=nix-store-$SYSTEM-$(sort "$RUNNER_TEMP/outputs" | sha256sum | cut -c1-32)" >> "$GITHUB_OUTPUT"
          echo "OUT=$(nix eval --raw ".#packages.$SYSTEM.gritlint.outPath")" >> "$GITHUB_ENV"
          echo "STORE_CACHE=$RUNNER_TEMP/nix-store" >> "$GITHUB_ENV"
      - name: Nix store cache
        id: store-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.STORE_CACHE }}
          key: ${{ steps.targets.outputs.key }}
          restore-keys: nix-store-${{ matrix.system }}-
      - name: Load the cached store paths
        if: steps.store-cache.outputs.cache-matched-key != ''
        run: xargs -a "$STORE_CACHE/paths" nix copy --no-check-sigs --from "file://$STORE_CACHE"

      - name: Let bwrap create user namespaces (ubuntu-24.04 AppArmor refuses them by default)
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Build every flake output for this system
        run: xargs -a "$RUNNER_TEMP/targets" nix build --no-link --print-build-logs
      - name: Benchmark against PR1
        if: matrix.system == 'x86_64-linux'
        run: tee -a "$GITHUB_STEP_SUMMARY" < "$(nix build --no-link --print-out-paths .#checks.x86_64-linux.gritlint-bench)/summary.md"
      - name: The npm tarball rebuilds bit for bit
        run: |
          nix build --no-link --rebuild ".#packages.$SYSTEM.workspace-tarballs"
          mkdir -p "$RUNNER_TEMP/release"
          cp -L "$(nix build --no-link --print-out-paths ".#packages.$SYSTEM.workspace-tarballs")"/* "$RUNNER_TEMP/release/"
          cp -L "$(nix build --no-link --print-out-paths ".#packages.$SYSTEM.gritlint-binaries")"/* "$RUNNER_TEMP/release/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-${{ matrix.system }}
          path: ${{ runner.temp }}/release/
          retention-days: 1

      - name: Export the unsigned store paths
        if: steps.store-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf "$STORE_CACHE"
          xargs -a "$RUNNER_TEMP/targets" -I{} nix eval --raw '{}.drvPath' --apply 'p: p + "\n"' |
            xargs nix-store --query --requisites --include-outputs |
            grep -v '\.drv$' |
            xargs nix path-info --sigs |
            awk '!/cache\.nixos\.org-1:/ { print $1 }' > "$RUNNER_TEMP/paths"
          xargs -a "$RUNNER_TEMP/paths" nix copy --to "file://$STORE_CACHE?compression=zstd"
          cp "$RUNNER_TEMP/paths" "$STORE_CACHE/paths"
      - name: Save the Nix store cache
        if: steps.store-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.STORE_CACHE }}
          key: ${{ steps.targets.outputs.key }}

      - name: cargo deny
        if: matrix.system == 'x86_64-linux'
        run: |
          export CARGO_HOME="$RUNNER_TEMP/cargo-home"
          mkdir -p "$CARGO_HOME"
          cp "$(nix build --no-link --print-out-paths ".#packages.$SYSTEM.gritlint-unwrapped.vendor")/config.toml" "$CARGO_HOME/"
          nix develop --command cargo deny check

      - name: Sandboxed check fails on planted violations and passes once fixed
        run: sh scripts/tools/gate-journey.sh "$OUT/bin/gritlint"
      - name: This repository's conventions
        run: |
          export PATH="$OUT/bin:$PATH"
          # The summary is the readable list; the annotations run gates the step.
          ./bin/gritlint check --format github-summary >> "$GITHUB_STEP_SUMMARY" || :
          ./bin/gritlint check --format github

  # A consumer's lockfile records the tarball's integrity once, so both systems
  # must build the same bytes. Each system cross-compiles the binary the other
  # builds natively, so a match also compares native against cross.
  tarballs-match:
    name: Tarball and binaries match across systems
    needs: nix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-*
          path: release
      - name: Every file is byte-identical to x86_64-linux's
        run: |
          set -euo pipefail
          ref=release/release-x86_64-linux
          other=release/release-aarch64-linux
          status=0
          for file in $(cd "$ref" && ls); do
            if cmp -s "$ref/$file" "$other/$file"; then continue; fi
            status=1
            echo "::error::aarch64-linux builds $file differently from x86_64-linux"
            case "$file" in
              *.tgz)
                a="$(mktemp -d)" b="$(mktemp -d)"
                tar -xzf "$ref/$file" -C "$a"
                tar -xzf "$other/$file" -C "$b"
                diff <(tar -tvzf "$ref/$file") <(tar -tvzf "$other/$file") || true
                diff -r "$a" "$b" || true
                ;;
              gritlint-*)
                echo "$({ cmp -l "$ref/$file" "$other/$file" || true; } | wc -l) bytes differ"
                diff <(strings -n 8 "$ref/$file" | grep /nix/store/ | sort -u) <(strings -n 8 "$other/$file" | grep /nix/store/ | sort -u) || true
                ;;
            esac
          done
          exit "$status"
      - name: Link inputs and C compilers, x86_64-linux's build against aarch64-linux's
        if: always()
        run: |
          set -euo pipefail
          ref=release/release-x86_64-linux
          other=release/release-aarch64-linux
          # Store paths and directories drop to the file's basename, hashes to H.
          norm() { sed -E 's#[^ (]*/##g; s/[0-9a-f]{16,}/H/g; s/cc[A-Za-z0-9]{6}\./ccX./g' "$1"; }
          # "output section|archive(member) or object" TAB summed input section size
          inputs() {
            norm "$1" | awk '
              function hex(s,   n, i) { n = 0; s = tolower(substr(s, 3)); for (i = 1; i <= length(s); i++) n = n * 16 + index("0123456789abcdef", substr(s, i, 1)) - 1; return n }
              function emit(size, file) { sum[out "|" file] += hex(size) }
              /^Linker script and memory map/ { on = 1; next }
              !on { next }
              /^[^ ]/ { out = $1; pending = 0; next }
              /^ [^ *]/ { pending = 0; if (NF >= 4 && $2 ~ /^0x/ && $3 ~ /^0x/) emit($3, $4); else if (NF == 1) pending = 1; next }
              pending && NF >= 3 && $1 ~ /^0x/ && $2 ~ /^0x/ { emit($2, $3) }
              { pending = 0 }
              END { for (key in sum) printf "%s\t%d\n", key, sum[key] }
            ' | LC_ALL=C sort
          }
          for target in linux-x64 linux-arm64; do
            echo "=== gritlint-$target, built on x86_64-linux (<) and aarch64-linux (>)"
            echo "--- input sections whose size differs or that one side lacks: section|input, x86_64-linux, aarch64-linux"
            LC_ALL=C join -t "$(printf '\t')" -a 1 -a 2 -e - -o 0,1.2,2.2 \
              <(inputs "$ref/gritlint-$target.link-map") <(inputs "$other/gritlint-$target.link-map") |
              awk -F '\t' '$2 != $3 { n++; if (n <= 120) print } END { print n + 0, "differing tuples" }'
            for part in cc-macros cc-driver cc-commands; do
              echo "--- $part"
              diff <(norm "$ref/gritlint-$target.$part" | sort) <(norm "$other/gritlint-$target.$part" | sort) | awk 'NR <= 25' || true
            done
          done

  # A change to the CLI, the engine or the packs changes what the tarball
  # reports, so it needs a changelog line even when npm/gritlint is untouched.
  changeset-intent:
    name: A change under crates, apps or packs adds an intent
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: sh scripts/tools/intent-gate.sh "${{ github.event.pull_request.base.sha }}" HEAD
