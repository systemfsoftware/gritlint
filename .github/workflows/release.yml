name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: release · shared tooling
    uses: systemfsoftware/pnpm-release-management/.github/workflows/release.yml@b9b4a1d48cc16241b33f9afd8ab99b82b05ce04f
    with:
      ci-workflow: ci.yml
    permissions:
      contents: write
      pull-requests: write
      actions: write
